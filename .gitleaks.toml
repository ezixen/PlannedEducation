# Gitleaks configuration for PlannedEducation
# This config ignores historical CI log files that contain test secrets

[allowlist]
description = "Ignore historical CI log files containing test secrets"
files = [
    "ci_log*.txt",
    "ci_log.txt",
    "ci_log2.txt",
    "ci_log3.txt",
    "ci_log4.txt",
    "ci_log5.txt",
    "ci_log6.txt",
    "ci_log7.txt",
    "ci_log8.txt",
    "ci_log9.txt",
    "ci_log10.txt",
    "ci_log11.txt",
    "ci_log12.txt",
    "ci_log13.txt",
    "ci_log14.txt",
    "ci_log15.txt",
    "ci_log16.txt",
]

# Also allow the throwaway CI-only Fernet test key
[[allowlist]]
description = "Throwaway CI-only Fernet test key (not a real secret)"
commits = [
    "0f30f5e76ec1a27ae5958f75221696209d8db46f",
    "ca7810a3cd072fe155b89b0060712786e66479a3",
]