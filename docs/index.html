<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Audio Player - PlannedEducation</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            color: #333;
        }
        .player-container {
            background: rgba(255, 255, 255, 0.95);
            border-radius: 24px;
            padding: 40px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
            max-width: 600px;
            width: 90%;
            text-align: center;
        }
        h1 { color: #667eea; margin-bottom: 8px; font-size: 24px; }
        .subtitle { color: #777; margin-bottom: 32px; font-size: 14px; }
        .audio-card {
            background: linear-gradient(135deg, #f5f7fa 0%, #c3cfe2 100%);
            border-radius: 16px;
            padding: 32px;
        }
        audio { width: 100%; margin-bottom: 24px; }
        .controls { display: flex; flex-direction: column; gap: 16px; }
        .control-row {
            display: flex;
            align-items: center;
            gap: 12px;
            justify-content: center;
        }
        .control-label {
            font-size: 14px;
            color: #555;
            min-width: 60px;
        }
        input[type="range"] {
            width: 220px;
            cursor: pointer;
        }
        .controls-note {
            margin-top: 16px;
            font-size: 13px;
            color: #888;
            line-height: 1.4;
        }
        .note-icon { color: #667eea; margin-right: 6px; }
        .footer {
            margin-top: 32px;
            font-size: 12px;
            color: #999;
            text-align: center;
        }
    </style>
</head>
<body>
    <div class="player-container">
        <h1>Education · Empathy · Love</h1>
        <div class="subtitle">PlannedEducation Audio Player</div>

        <div class="audio-card">
            <audio id="audioPlayer" preload="auto" controls>
                <source src="https://raw.githubusercontent.com/ezixen/PlannedEducation/dev/docs/assets/audio/speech_only_education_empathy_love.mp3" type="audio/mpeg">
                Your browser does not support the audio element.
            </audio>

            <div class="controls">
                <div class="control-row">
                    <span class="control-label">🔊 Volume</span>
                    <input type="range" id="volumeSlider" min="0" max="1" step="0.1" value="1">
                </div>
                <div class="controls-note">
                    <span class="note-icon">💡</span>
                    Browsers may block autoplay with sound. Click the play button above to start.
                </div>
            </div>
        </div>

        <div class="footer">
            Built with ☕ and ♥ for equitable education. -ezixen
        </div>
    </div>

    <script>
        const audio = document.getElementById('audioPlayer');
        const volumeSlider = document.getElementById('volumeSlider');

        audio.volume = parseFloat(volumeSlider.value);

        volumeSlider.addEventListener('input', function() {
            audio.volume = parseFloat(this.value);
        });

        function tryAutoplay() {
            audio.play().then(function() {}).catch(function(error) {
                console.log('Autoplay blocked:', error);
            });
        }

        tryAutoplay();
    </script>
</body>
</html>
