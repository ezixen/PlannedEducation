<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Planned Education - Audio Player</title>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            margin: 0;
            padding: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }
        .container {
            background: white;
            border-radius: 16px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
            padding: 40px;
            max-width: 500px;
            width: 90%;
            text-align: center;
        }
        h1 {
            color: #333;
            margin-bottom: 8px;
        }
        p {
            color: #666;
            margin-bottom: 32px;
        }
        audio {
            width: 100%;
            margin-top: 20px;
        }
        .logo {
            width: 80px;
            height: 80px;
            margin-bottom: 16px;
            border-radius: 12px;
        }
    </style>
</head>
<body>
    <div class="container">
        <img src="https://raw.githubusercontent.com/ezixen/PlannedEducation/dev/docs/assets/branding/PElogo_128x128.jpg" alt="Planned Education Logo" class="logo">
        <h1>Planned Education 🎓</h1>
        <p>Education, Empathy, Love</p>
        <audio controls autoplay>
            <source src="https://raw.githubusercontent.com/ezixen/PlannedEducation/dev/docs/assets/audio/speech_only_education_empathy_love.mp3" type="audio/mpeg">
            Your browser does not support the audio element.
        </audio>
        <p style="margin-top: 24px; font-size: 14px; color: #888;">
            If audio doesn't start automatically, click the play button above.
        </p>
        <p style="margin-top: 16px;">
            <a href="https://github.com/ezixen/PlannedEducation" style="color: #667eea; text-decoration: none;">← Back to PlannedEducation</a>
        </p>
    </div>
</body>
</html>
