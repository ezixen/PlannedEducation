# Prometheus Alerting Rules for PlannedEducation
# SLO Burn Rate Alerting per NIST CSF 2.0 / Google SRE practices
# Free/Open-Source Only - No paid monitoring services

groups:
  - name: plannededucation-slo-alerts
    interval: 30s
    rules:
      # ============================================================
      # API Latency SLO: p95 < 500ms
      # ============================================================
      - alert: APILatencySLOBurnRateFast
        expr: |
          (
            sum(rate(http_request_duration_seconds_bucket{le="0.5"}[5m])) by (job)
            /
            sum(rate(http_request_duration_seconds_count[5m])) by (job)
          ) < 0.95
        for: 5m
        labels:
          severity: critical
          slo: api_latency_p95
          burn_rate: "fast"
        annotations:
          summary: "API Latency SLO burn rate (fast) - p95 > 500ms"
          description: |
            API p95 latency has exceeded 500ms for 5 minutes.
            Current p95: {{ $value | humanizePercentage }}
            SLO target: 95% of requests < 500ms
            This is a fast burn rate (5m window) - immediate attention required.

      - alert: APILatencySLOBurnRateSlow
        expr: |
          (
            sum(rate(http_request_duration_seconds_bucket{le="0.5"}[1h])) by (job)
            /
            sum(rate(http_request_duration_seconds_count[1h])) by (job)
          ) < 0.95
        for: 30m
        labels:
          severity: warning
          slo: api_latency_p95
          burn_rate: "slow"
        annotations:
          summary: "API Latency SLO burn rate (slow) - p95 > 500ms"
          description: |
            API p95 latency has exceeded 500ms for 30 minutes.
            Current p95: {{ $value | humanizePercentage }}
            SLO target: 95% of requests < 500ms
            This is a slow burn rate (1h window) - investigate and resolve.

      # ============================================================
      # API Availability SLO: > 99.9%
      # ============================================================
      - alert: APIAvailabilitySLOBurnRateFast
        expr: |
          (
            sum(rate(http_requests_total{status_code=~"5.."}[5m])) by (job)
            /
            sum(rate(http_requests_total[5m])) by (job)
          ) > 0.001
        for: 5m
        labels:
          severity: critical
          slo: api_availability
          burn_rate: "fast"
        annotations:
          summary: "API Availability SLO burn rate (fast) - error rate > 0.1%"
          description: |
            API 5xx error rate has exceeded 0.1% for 5 minutes.
            Current error rate: {{ $value | humanizePercentage }}
            SLO target: 99.9% availability (0.1% error budget)
            This is a fast burn rate (5m window) - immediate attention required.

      - alert: APIAvailabilitySLOBurnRateSlow
        expr: |
          (
            sum(rate(http_requests_total{status_code=~"5.."}[1h])) by (job)
            /
            sum(rate(http_requests_total[1h])) by (job)
          ) > 0.001
        for: 30m
        labels:
          severity: warning
          slo: api_availability
          burn_rate: "slow"
        annotations:
          summary: "API Availability SLO burn rate (slow) - error rate > 0.1%"
          description: |
            API 5xx error rate has exceeded 0.1% for 30 minutes.
            Current error rate: {{ $value | humanizePercentage }}
            SLO target: 99.9% availability (0.1% error budget)
            This is a slow burn rate (1h window) - investigate and resolve.

      # ============================================================
      # Exam Submission Success Rate SLO: > 99.5%
      # ============================================================
      - alert: ExamSubmissionSLOBurnRateFast
        expr: |
          (
            sum(rate(exam_submissions_total{status="failed"}[5m])) by (job)
            /
            sum(rate(exam_submissions_total[5m])) by (job)
          ) > 0.005
        for: 5m
        labels:
          severity: critical
          slo: exam_submission_success
          burn_rate: "fast"
        annotations:
          summary: "Exam Submission SLO burn rate (fast) - failure rate > 0.5%"
          description: |
            Exam submission failure rate has exceeded 0.5% for 5 minutes.
            Current failure rate: {{ $value | humanizePercentage }}
            SLO target: 99.5% success rate (0.5% error budget)
            This is a fast burn rate (5m window) - immediate attention required.

      - alert: ExamSubmissionSLOBurnRateSlow
        expr: |
          (
            sum(rate(exam_submissions_total{status="failed"}[1h])) by (job)
            /
            sum(rate(exam_submissions_total[1h])) by (job)
          ) > 0.005
        for: 30m
        labels:
          severity: warning
          slo: exam_submission_success
          burn_rate: "slow"
        annotations:
          summary: "Exam Submission SLO burn rate (slow) - failure rate > 0.5%"
          description: |
            Exam submission failure rate has exceeded 0.5% for 30 minutes.
            Current failure rate: {{ $value | humanizePercentage }}
            SLO target: 99.5% success rate (0.5% error budget)
            This is a slow burn rate (1h window) - investigate and resolve.

      # ============================================================
      # AI Grading Response Time SLO: < 30s
      # ============================================================
      - alert: AIGradingLatencySLOBurnRateFast
        expr: |
          histogram_quantile(0.95, sum(rate(ai_grading_requests_duration_seconds_bucket[5m])) by (le, job)) > 30
        for: 5m
        labels:
          severity: critical
          slo: ai_grading_latency
          burn_rate: "fast"
        annotations:
          summary: "AI Grading Latency SLO burn rate (fast) - p95 > 30s"
          description: |
            AI grading p95 latency has exceeded 30 seconds for 5 minutes.
            Current p95: {{ $value }}s
            SLO target: 95% of AI grading requests < 30s
            This is a fast burn rate (5m window) - immediate attention required.

      - alert: AIGradingLatencySLOBurnRateSlow
        expr: |
          histogram_quantile(0.95, sum(rate(ai_grading_requests_duration_seconds_bucket[1h])) by (le, job)) > 30
        for: 30m
        labels:
          severity: warning
          slo: ai_grading_latency
          burn_rate: "slow"
        annotations:
          summary: "AI Grading Latency SLO burn rate (slow) - p95 > 30s"
          description: |
            AI grading p95 latency has exceeded 30 seconds for 30 minutes.
            Current p95: {{ $value }}s
            SLO target: 95% of AI grading requests < 30s
            This is a slow burn rate (1h window) - investigate and resolve.

      # ============================================================
      # AI Grading Error Rate Alert
      # ============================================================
      - alert: AIGradingHighErrorRate
        expr: |
          (
            sum(rate(ai_grading_requests_total{status="error"}[5m])) by (job)
            /
            sum(rate(ai_grading_requests_total[5m])) by (job)
          ) > 0.05
        for: 5m
        labels:
          severity: warning
          component: ai_grading
        annotations:
          summary: "AI Grading error rate > 5%"
          description: |
            AI grading error rate has exceeded 5% for 5 minutes.
            Current error rate: {{ $value | humanizePercentage }}
            Check provider status and API key validity.

      # ============================================================
      # Cost Alerting
      # ============================================================
      - alert: AICostBudgetExceeded
        expr: |
          sum(ai_cost_usd_total) by (teacher_id) > 10
        for: 1m
        labels:
          severity: warning
          component: ai_cost
        annotations:
          summary: "Teacher AI cost budget exceeded"
          description: |
            Teacher {{ $labels.teacher_id }} has exceeded the daily AI cost budget of $10.
            Current cost: ${{ $value }}

      - alert: AICostBudgetWarning
        expr: |
          sum(ai_cost_usd_total) by (teacher_id) > 8
        for: 1m
        labels:
          severity: info
          component: ai_cost
        annotations:
          summary: "Teacher AI cost budget at 80%"
          description: |
            Teacher {{ $labels.teacher_id }} has reached 80% of daily AI cost budget ($8/$10).
            Current cost: ${{ $value }}

      # ============================================================
      # Infrastructure Alerts
      # ============================================================
      - alert: BackendDown
        expr: up{job="plannededucation-backend"} == 0
        for: 1m
        labels:
          severity: critical
          component: backend
        annotations:
          summary: "Backend API is down"
          description: "Backend API has been down for 1 minute."

      - alert: FrontendDown
        expr: up{job="plannededucation-frontend"} == 0
        for: 1m
        labels:
          severity: critical
          component: frontend
        annotations:
          summary: "Frontend is down"
          description: "Frontend has been down for 1 minute."

      - alert: DatabaseDown
        expr: up{job="postgres"} == 0
        for: 1m
        labels:
          severity: critical
          component: database
        annotations:
          summary: "PostgreSQL database is down"
          description: "PostgreSQL database has been down for 1 minute."

      - alert: RedisDown
        expr: up{job="redis"} == 0
        for: 1m
        labels:
          severity: warning
          component: redis
        annotations:
          summary: "Redis is down"
          description: "Redis has been down for 1 minute. WebSocket broadcasting may be affected."

      - alert: HighMemoryUsage
        expr: |
          (container_memory_usage_bytes / container_spec_memory_limit_bytes) > 0.9
        for: 5m
        labels:
          severity: warning
          component: infrastructure
        annotations:
          summary: "Container memory usage > 90%"
          description: "Container {{ $labels.container }} memory usage is above 90%."

      - alert: HighCPUUsage
        expr: |
          (rate(container_cpu_usage_seconds_total[5m]) / container_spec_cpu_quota / container_spec_cpu_period) > 0.9
        for: 5m
        labels:
          severity: warning
          component: infrastructure
        annotations:
          summary: "Container CPU usage > 90%"
          description: "Container {{ $labels.container }} CPU usage is above 90%."

      - alert: DiskSpaceLow
        expr: |
          (node_filesystem_avail_bytes / node_filesystem_size_bytes) < 0.1
        for: 5m
        labels:
          severity: warning
          component: infrastructure
        annotations:
          summary: "Disk space < 10% remaining"
          description: "Filesystem {{ $labels.mountpoint }} on {{ $labels.instance }} has less than 10% disk space remaining."

      # ============================================================
      # Security Alerts
      # ============================================================
      - alert: HighAuthFailureRate
        expr: |
          sum(rate(http_requests_total{endpoint=~"/auth/.*",status_code=~"4.."}[5m])) by (job)
          /
          sum(rate(http_requests_total{endpoint=~"/auth/.*"}[5m])) by (job)
          > 0.5
        for: 5m
        labels:
          severity: warning
          component: security
        annotations:
          summary: "High authentication failure rate > 50%"
          description: |
            Authentication endpoints are experiencing > 50% failure rate.
            Possible brute force attack or configuration issue.

      - alert: GitleaksDetection
        expr: gitleaks_secrets_detected > 0
        for: 0m
        labels:
          severity: critical
          component: security
        annotations:
          summary: "Gitleaks detected secrets in repository"
          description: "Gitleaks scan found {{ $value }} potential secrets in the codebase."

      # ============================================================
      # Backup/Restore Alerts
      # ============================================================
      - alert: BackupFailed
        expr: backup_last_success_timestamp < (time() - 86400)
        for: 0m
        labels:
          severity: critical
          component: backup
        annotations:
          summary: "Backup has not succeeded in 24 hours"
          description: "Last successful backup was {{ $value | humanizeDuration }} ago."

      - alert: BackupAgeWarning
        expr: backup_last_success_timestamp < (time() - 43200)
        for: 0m
        labels:
          severity: warning
          component: backup
        annotations:
          summary: "Backup is older than 12 hours"
          description: "Last successful backup was {{ $value | humanizeDuration }} ago."

      - alert: RestoreDrillOverdue
        expr: restore_drill_last_success_timestamp < (time() - 2592000)
        for: 0m
        labels:
          severity: warning
          component: backup
        annotations:
          summary: "Restore drill overdue (> 30 days)"
          description: "Last successful restore drill was {{ $value | humanizeDuration }} ago."

  # ============================================================
  # NIST CSF 2.0 Function-Specific Alerts
  # ============================================================
  # GOVERN (GV) - Organizational Context & Risk Strategy
  # IDENTIFY (ID) - Asset & Risk Understanding
  # PROTECT (PR) - Safeguards
  # DETECT (DE) - Continuous Monitoring
  # RESPOND (RS) - Incident Response
  # RECOVER (RC) - Recovery Planning

  # GOVERN: Policy compliance and risk management
  - alert: PolicyViolationDetected
    expr: policy_violations_total > 0
    for: 0m
    labels:
      severity: warning
      csf_function: govern
      csf_category: gv_po
    annotations:
      summary: "Policy violation detected"
      description: "Policy violation detected: {{ $labels.violation_type }}. Review and remediate."

  - alert: RiskAssessmentOverdue
    expr: risk_assessment_last_completed < (time() - 7776000)  # 90 days
    for: 0m
    labels:
      severity: warning
      csf_function: govern
      csf_category: gv_rm
    annotations:
      summary: "Risk assessment overdue (> 90 days)"
      description: "Last risk assessment was {{ $value | humanizeDuration }} ago. Schedule new assessment."

  # IDENTIFY: Asset management and risk assessment
  - alert: UnmanagedAssetDetected
    expr: unmanaged_assets_total > 0
    for: 0m
    labels:
      severity: warning
      csf_function: identify
      csf_category: id_am
    annotations:
      summary: "Unmanaged asset detected"
      description: "{{ $value }} unmanaged asset(s) detected. Inventory and assess."

  - alert: VulnerabilityScanOverdue
    expr: vulnerability_scan_last_completed < (time() - 604800)  # 7 days
    for: 0m
    labels:
      severity: warning
      csf_function: identify
      csf_category: id_ra
    annotations:
      summary: "Vulnerability scan overdue (> 7 days)"
      description: "Last vulnerability scan was {{ $value | humanizeDuration }} ago."

  - alert: SupplyChainRiskElevated
    expr: supply_chain_risk_score > 7
    for: 5m
    labels:
      severity: warning
      csf_function: identify
      csf_category: id_sc
    annotations:
      summary: "Supply chain risk score elevated"
      description: "Supply chain risk score is {{ $value }}/10. Review third-party dependencies."

  # PROTECT: Access control, data security, and training
  - alert: PrivilegeEscalationAttempt
    expr: rate(privilege_escalation_attempts_total[5m]) > 0
    for: 0m
    labels:
      severity: critical
      csf_function: protect
      csf_category: pr_ac
    annotations:
      summary: "Privilege escalation attempt detected"
      description: "User {{ $labels.user_id }} attempted privilege escalation. Investigate immediately."

  - alert: DataExfiltrationAttempt
    expr: rate(data_exfiltration_attempts_total[5m]) > 0
    for: 0m
    labels:
      severity: critical
      csf_function: protect
      csf_category: pr_ds
    annotations:
      summary: "Data exfiltration attempt detected"
      description: "Potential data exfiltration from {{ $labels.source }}. Investigate immediately."

  - alert: EncryptionComplianceViolation
    expr: unencrypted_sensitive_data_total > 0
    for: 0m
    labels:
      severity: warning
      csf_function: protect
      csf_category: pr_ds
    annotations:
      summary: "Unencrypted sensitive data detected"
      description: "{{ $value }} sensitive data field(s) found unencrypted. Encrypt immediately."

  - alert: MFAComplianceViolation
    expr: users_without_mfa_total > 0
    for: 0m
    labels:
      severity: warning
      csf_function: protect
      csf_category: pr_aa
    annotations:
      summary: "Users without MFA detected"
      description: "{{ $value }} user(s) without MFA enabled. Enforce MFA policy."

  # DETECT: Continuous monitoring and anomaly detection
  - alert: AnomalousUserBehavior
    expr: user_anomaly_score > 80
    for: 5m
    labels:
      severity: warning
      csf_function: detect
      csf_category: de_cm
    annotations:
      summary: "Anomalous user behavior detected"
      description: "User {{ $labels.user_id }} anomaly score is {{ $value }}. Review activity."

  - alert: SuspiciousNetworkTraffic
    expr: network_anomaly_score > 75
    for: 5m
    labels:
      severity: warning
      csf_function: detect
      csf_category: de_cm
    annotations:
      summary: "Suspicious network traffic detected"
      description: "Network anomaly score {{ $value }} from {{ $labels.source_ip }}. Investigate."

  - alert: LogIngestionFailure
    expr: rate(log_ingestion_failures_total[5m]) > 0
    for: 1m
    labels:
      severity: warning
      csf_function: detect
      csf_category: de_dp
    annotations:
      summary: "Log ingestion failure"
      description: "Log ingestion pipeline failing. Check log pipeline health."

  # RESPOND: Incident response
  - alert: IncidentResponseOverdue
    expr: incident_open_duration_seconds > 3600  # 1 hour
    for: 0m
    labels:
      severity: warning
      csf_function: respond
      csf_category: rs_rp
    annotations:
      summary: "Incident response overdue (> 1 hour)"
      description: "Incident {{ $labels.incident_id }} open for {{ $value | humanizeDuration }}. Escalate."

  - alert: ContainmentActionMissing
    expr: incident_without_containment_total > 0
    for: 0m
    labels:
      severity: warning
      csf_function: respond
      csf_category: rs_mi
    annotations:
      summary: "Incident without containment action"
      description: "{{ $value }} incident(s) without documented containment. Apply containment."

  - alert: CommunicationPlanNotExecuted
    expr: incident_without_communication_total > 0
    for: 0m
    labels:
      severity: warning
      csf_function: respond
      csf_category: rs_co
    annotations:
      summary: "Incident communication plan not executed"
      description: "{{ $value }} incident(s) without stakeholder notification. Execute communication plan."

  # RECOVER: Recovery planning and improvements
  - alert: RecoveryPlanMissing
    expr: critical_services_without_recovery_plan > 0
    for: 0m
    labels:
      severity: warning
      csf_function: recover
      csf_category: rc_rp
    annotations:
      summary: "Critical service missing recovery plan"
      description: "{{ $value }} critical service(s) lack documented recovery plan. Create plan."

  - alert: BackupRestoreTestOverdue
    expr: backup_restore_test_last_completed < (time() - 7776000)  # 90 days
    for: 0m
    labels:
      severity: warning
      csf_function: recover
      csf_category: rc_rp
    annotations:
      summary: "Backup restore test overdue (> 90 days)"
      description: "Last backup restore test was {{ $value | humanizeDuration }} ago. Schedule test."

  - alert: RecoveryTimeObjectiveBreach
    expr: actual_recovery_time_seconds > recovery_time_objective_seconds
    for: 0m
    labels:
      severity: critical
      csf_function: recover
      csf_category: rc_rp
    annotations:
      summary: "Recovery Time Objective (RTO) breached"
      description: "Service {{ $labels.service }} recovery took {{ $value }}s, exceeding RTO of {{ $labels.rto_seconds }}s."