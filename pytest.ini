[pytest]
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*
addopts = 
    -v
    --tb=short
    --strict-markers
    --disable-warnings
    -p no:warnings
filterwarnings =
    ignore::DeprecationWarning
    ignore::PendingDeprecationWarning
    ignore::starlette.datastructures.URL.__init__:starlette.datastructures.URL.__init__ is deprecated
    ignore::pydantic.v1.utils.utcnow:datetime.utcnow is deprecated
    ignore::fastapi.testclient:Using `httpx` with `starlette.testclient` is deprecated

# Logging configuration for tests
log_cli = true
log_cli_level = INFO
log_cli_format = %(asctime)s [%(levelname)8s] %(name)s: %(message)s
log_cli_date_format = %H:%M:%S

log_file = artifacts/test_run.log
log_file_level = DEBUG
log_file_format = %(asctime)s [%(levelname)8s] %(name)s:%(lineno)d: %(message)s
log_file_date_format = %Y-%m-%d %H:%M:%S

# Test markers
markers =
    tracked: mark test as tracked for incremental runs
    slow: marks tests as slow
    integration: marks tests as integration tests
    unit: marks tests as unit tests
    ui: marks tests as UI tests
    auth: marks tests as authentication tests
    exam: marks tests as exam-related tests
    ai: marks tests as AI-related tests
    proctoring: marks tests as proctoring tests
    chat: marks tests as chat tests
    ocr: marks tests as OCR tests
    stt: marks tests as STT tests
    archive: marks tests as archive tests
    anonymizer: marks tests as anonymizer tests
    parent: marks tests as parent portal tests
    admin: marks tests as admin tests
    chatgpt: marks tests as ChatGPT tests
    asyncio: marks async tests