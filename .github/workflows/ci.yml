# GitHub Actions CI/CD - Free Tier Only
# This workflow uses ONLY GitHub Actions free tier (2000 min/month for private repos)
# NO PAID CI/CD SERVICES
# Policy: docs/GITHUB_FREE_TIER.md

name: CI/CD Pipeline

on:
  push:
    branches: [main, dev, develop]
  pull_request:
    branches: [main, dev, develop]
  workflow_dispatch:

env:
  # Use free tiers only
  DATABASE_URL: sqlite:///./test.db
  PLANNED_EDUCATION_ENV: test
  ALLOW_DEV_AUTH: "true"
  JWT_SECRET_KEY: "test-secret-key-for-ci-only"
  CORS_ORIGINS: "http://localhost:5173"
  AI_KEY_MASTER_SECRET: "EJEtzTWXcAvRD5ZfTZWJ7j5wKfdNdXoSrjGlx1uUrbw=" # gitleaks:allow (throwaway CI-only test key)

jobs:
  # Backend Tests
  backend-tests:
    name: Backend Tests (Python)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: src/requirements.txt

      - name: Install dependencies
        run: |
          cd src
          pip install -r requirements.txt

      - name: Run linting (ruff)
        run: |
          pip install ruff
          ruff check src/

      - name: Run type checking (mypy)
        # Non-blocking: ~99 pre-existing SQLAlchemy Column typing errors; burn down then remove.
        continue-on-error: true
        run: |
          pip install mypy
          mypy src/plannededucation --ignore-missing-imports --namespace-packages --explicit-package-bases

      - name: Run security scan (bandit)
        run: |
          pip install bandit
          bandit -r src/ -f json -o bandit-report.json || true

      - name: Run tests with coverage
        run: |
          pip install pytest pytest-cov
          PYTHONPATH=. pytest tests/ -v --cov=src/plannededucation --cov-report=xml --cov-report=term-missing

  # Frontend Tests
  frontend-tests:
    name: Frontend Tests (Node.js)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: web/apps/portal/package-lock.json

      - name: Install dependencies
        run: |
          cd web/apps/portal
          npm ci

      - name: Run linting
        run: |
          cd web/apps/portal
          npm run lint

      - name: Type check
        run: |
          cd web/apps/portal
          npx tsc --noEmit

      - name: Build
        run: |
          cd web/apps/portal
          npm run build

  # Security Scans (Free OSS only - no paid GitHub Advanced Security)
  security-scans:
    name: Security Scans (Free OSS)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: web/apps/portal/package-lock.json

      - name: Install Python dependencies + pip-audit
        run: |
          cd src
          pip install -r requirements.txt pip-audit

      - name: Run pip-audit (Python dependency audit)
        run: |
          cd src
          python -m pip_audit --strict -r requirements.txt

      - name: Install Node dependencies (portal)
        run: |
          cd web/apps/portal
          npm ci --ignore-scripts

      - name: Run npm audit (production deps only)
        run: |
          cd web/apps/portal
          npm audit --omit=dev --audit-level=high

      # Upstream OSS binary (MIT). Do not use gitleaks/gitleaks-action (wrapper licenses).
      - name: gitleaks (OSS CLI)
        env:
          GITLEAKS_VERSION: "8.24.3"
        run: |
          curl -sSL "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz" \
            | tar -xz gitleaks
          ./gitleaks version
          ./gitleaks detect --source . --verbose --redact --baseline-path gitleaks-baseline.json --ignore-path .gitleaksignore

  # Supply Chain Security: SBOM Generation (Free OSS)
  sbom-generation:
    name: Generate SBOM (CycloneDX)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: [backend-tests, frontend-tests]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install cyclonedx-bom (Free OSS)
        run: |
          pip install cyclonedx-bom

      - name: Generate Python SBOM
        run: |
          cd src
          cyclonedx-py requirements -o ../sbom-python.json --of json

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: web/apps/portal/package-lock.json

      - name: Generate NPM SBOM
        run: |
          cd web/apps/portal
          npm ci --ignore-scripts
          npx --yes @cyclonedx/cyclonedx-npm \
            --output-format JSON \
            --output-file "${{ github.workspace }}/sbom-npm.json" \
            package.json

      - name: Merge SBOMs
        run: |
          python - <<'PY'
          import json
          import os
          workspace = os.environ.get("GITHUB_WORKSPACE", ".")
          with open(os.path.join(workspace, "sbom-python.json")) as f:
              py = json.load(f)
          with open(os.path.join(workspace, "sbom-npm.json")) as f:
              npm = json.load(f)
          # Merge components
          py.setdefault("components", []).extend(npm.get("components", []))
          py.setdefault("services", []).extend(npm.get("services", []))
          py.setdefault("dependencies", []).extend(npm.get("dependencies", []))
          with open(os.path.join(workspace, "sbom-merged.json"), "w") as f:
              json.dump(py, f, indent=2)
          PY

      - name: Upload SBOM artifact
        uses: actions/upload-artifact@v4
        with:
          name: sbom
          path: sbom-merged.json
          retention-days: 7

  # Supply Chain Security: Artifact Signing with Cosign (Free OSS, keyless)
  artifact-signing:
    name: Sign Artifacts with Cosign (Keyless)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: [sbom-generation]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    permissions:
      id-token: write  # Required for keyless signing
      contents: read
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install cosign (Free OSS)
        uses: sigstore/cosign-installer@v3
        with:
          cosign-release: 'v2.2.4'

      - name: Download SBOM
        uses: actions/download-artifact@v4
        with:
          name: sbom
          path: .

      - name: Sign SBOM
        run: |
          cosign sign-blob --yes sbom-merged.json --output-signature sbom-merged.json.sig

      - name: Upload signatures
        uses: actions/upload-artifact@v4
        with:
          name: signatures
          path: sbom-merged.json.sig
          retention-days: 7

  # Summary
  summary:
    name: CI Summary
    runs-on: ubuntu-latest
    needs: [backend-tests, frontend-tests, security-scans, sbom-generation, artifact-signing]
    if: always()
    steps:
      - name: Check job statuses
        run: |
          echo "Backend Tests: ${{ needs.backend-tests.result }}"
          echo "Frontend Tests: ${{ needs.frontend-tests.result }}"
          echo "Security Scans: ${{ needs.security-scans.result }}"
          if [ "${{ needs.backend-tests.result }}" != "success" ] || [ "${{ needs.frontend-tests.result }}" != "success" ] || [ "${{ needs.security-scans.result }}" != "success" ]; then
            echo "::error::One or more required jobs failed"
            exit 1
          fi
