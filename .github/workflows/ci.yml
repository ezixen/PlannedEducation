# GitHub Actions CI/CD - Free Tier Only
# This workflow uses ONLY GitHub Actions free tier (2000 min/month for private repos)
# NO PAID CI/CD SERVICES
# Policy: docs/GITHUB_FREE_TIER.md

name: CI/CD Pipeline

on:
  push:
    branches: [main, dev, develop]
  pull_request:
    branches: [main, dev, develop]
  workflow_dispatch:

env:
  # Use free tiers only
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"
  DATABASE_URL: sqlite:///./test.db
  PLANNED_EDUCATION_ENV: test
  ALLOW_DEV_AUTH: "true"
  JWT_SECRET_KEY: "test-secret-key-for-ci-only-32bytes-minimum" # gitleaks:allow
  CORS_ORIGINS: "http://localhost:5173"
  AI_KEY_MASTER_SECRET: "EJEtzTWXcAvRD5ZfTZWJ7j5wKfdNdXoSrjGlx1uUrbw=" # gitleaks:allow (throwaway CI-only test key)

jobs:
  # Backend Tests
  backend-tests:
    name: Backend Tests (Python)
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: src/requirements.txt

      - name: Install dependencies
        run: |
          cd src
          pip install -r requirements.txt

      - name: Run linting (ruff)
        run: |
          pip install ruff
          ruff check src/

      - name: Run type checking (mypy)
        # Non-blocking: ~99 pre-existing SQLAlchemy Column typing errors; burn down then remove.
        continue-on-error: true
        run: |
          pip install mypy
          mypy src/plannededucation --ignore-missing-imports --namespace-packages --explicit-package-bases || true

      - name: Run security scan (bandit)
        run: |
          pip install bandit
          bandit -r src/ -f json -o bandit-report.json || true

      - name: Run dependency audit (pip-audit)
        run: |
          pip install pip-audit
          pip-audit -r src/requirements.txt --strict

      - name: Run tests with coverage
        run: |
          pip install pytest pytest-cov
          PYTHONPATH=. pytest tests/ -v --cov=src/plannededucation --cov-report=xml --cov-report=term-missing

  # Frontend Tests
  frontend-tests:
    name: Frontend Tests (Node.js)
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: web/apps/portal/package-lock.json

      - name: Install dependencies
        run: |
          cd web/apps/portal
          npm ci

      - name: Run linting
        run: |
          cd web/apps/portal
          npm run lint

      - name: Type check
        run: |
          cd web/apps/portal
          npx tsc --noEmit

      - name: Build
        run: |
          cd web/apps/portal
          npm run build

      - name: Run npm audit (production deps only)
        run: |
          cd web/apps/portal
          npm audit --omit=dev --audit-level=high

      - name: Check license compliance
        run: |
          cd web/apps/portal
          npx license-checker --excludePrivatePackages --onlyAllow 'MIT;Apache-2.0;BSD-3-Clause;BSD-2-Clause;ISC;MIT-0;0BSD;BlueOak-1.0.0;CC0-1.0;CC-BY-4.0;CC-BY-3.0;MPL-2.0' --failOnViolation

  # Security Scans (Free OSS only - no paid GitHub Advanced Security)
  security-scans:
    name: Security Scans (Free OSS)
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          fetch-depth: 1

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: web/apps/portal/package-lock.json

      - name: Install Python dependencies + pip-audit
        run: |
          cd src
          pip install -r requirements.txt pip-audit

      - name: Run pip-audit (Python dependency audit)
        run: |
          cd src
          python -m pip_audit --strict -r requirements.txt

      - name: Install Node dependencies (portal)
        run: |
          cd web/apps/portal
          npm ci --ignore-scripts

      - name: Run npm audit (production deps only)
        run: |
          cd web/apps/portal
          npm audit --omit=dev --audit-level=high

      # Upstream OSS binary (MIT). Do not use gitleaks/gitleaks-action (wrapper licenses).
      - name: gitleaks (OSS CLI)
        env:
          GITLEAKS_VERSION: "8.24.3"
        run: |
          curl -sSL "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz" \
            | tar -xz gitleaks
          ./gitleaks version
          ./gitleaks detect --source . --verbose --redact --config .gitleaks.toml --no-git

  # Container Security Scanning (Free OSS)
  container-scans:
    name: Container Scans (Trivy)
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    needs: [backend-tests, frontend-tests]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Install Trivy (Free OSS)
        run: |
          curl -sfL https://raw.githubusercontent.com/aquasecurity/trivy/main/contrib/install.sh | sh -s -- -b /usr/local/bin

      - name: Scan Backend Dockerfile
        run: |
          trivy image --ignore-unfixed --severity HIGH,CRITICAL --exit-code 1 --format sarif --output trivy-backend.sarif \
            $(docker build -q -f Dockerfile.backend .)

      - name: Scan Frontend Dockerfile
        run: |
          trivy image --ignore-unfixed --severity HIGH,CRITICAL --exit-code 1 --format sarif --output trivy-frontend.sarif \
            $(docker build -q -f Dockerfile.frontend .)

      - name: Upload Trivy Results
        uses: actions/upload-artifact@v7
        with:
          name: trivy-results
          path: trivy-*.sarif
          retention-days: 7

  # Supply Chain Security: SBOM Generation (Free OSS)
  sbom-generation:
    name: Generate SBOM (CycloneDX)
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    needs: [backend-tests, frontend-tests, container-scans]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install cyclonedx-bom (Free OSS)
        run: |
          pip install cyclonedx-bom

      - name: Generate Python SBOM
        run: |
          cd src
          cyclonedx-py requirements -o ../sbom-python.json --of json

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: web/apps/portal/package-lock.json

      - name: Generate NPM SBOM
        run: |
          cd web/apps/portal
          npm ci --ignore-scripts
          npx --yes @cyclonedx/cyclonedx-npm \
            --output-format JSON \
            --output-file "${{ github.workspace }}/sbom-npm.json" \
            package.json

      - name: Merge SBOMs
        run: |
          python - <<'PY'
          import json
          import os
          workspace = os.environ.get("GITHUB_WORKSPACE", ".")
          with open(os.path.join(workspace, "sbom-python.json")) as f:
              py = json.load(f)
          with open(os.path.join(workspace, "sbom-npm.json")) as f:
              npm = json.load(f)
          # Merge components
          py.setdefault("components", []).extend(npm.get("components", []))
          py.setdefault("services", []).extend(npm.get("services", []))
          py.setdefault("dependencies", []).extend(npm.get("dependencies", []))
          with open(os.path.join(workspace, "sbom-merged.json"), "w") as f:
              json.dump(py, f, indent=2)
          PY

      - name: Upload SBOM artifact
        uses: actions/upload-artifact@v7
        with:
          name: sbom
          path: sbom-merged.json
          retention-days: 7

  # Supply Chain Security: Artifact Signing with Cosign (Free OSS, keyless)
  artifact-signing:
    name: Sign Artifacts with Cosign (Keyless)
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    needs: [sbom-generation]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    permissions:
      id-token: write  # Required for keyless signing
      contents: read
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Install cosign (Free OSS)
        uses: sigstore/cosign-installer@v4.1.2

      - name: Download SBOM
        uses: actions/download-artifact@v8
        with:
          name: sbom
          path: .

      - name: Sign SBOM
        run: |
          cosign sign-blob --yes sbom-merged.json --output-signature sbom-merged.json.sig

      - name: Upload signatures
        uses: actions/upload-artifact@v7
        with:
          name: signatures
          path: sbom-merged.json.sig
          retention-days: 7

  # Supply Chain Security: SLSA Provenance (Free OSS)
  slsa-provenance:
    name: Generate SLSA Provenance
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    needs: [artifact-signing]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    permissions:
      id-token: write
      contents: read
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Install cosign (Free OSS)
        uses: sigstore/cosign-installer@v4.1.2

      - name: Download SBOM
        uses: actions/download-artifact@v8
        with:
          name: sbom
          path: .

      - name: Generate and sign SLSA v1.0 provenance statement
        run: |
          SHA256=$(sha256sum sbom-merged.json | awk '{print $1}')
          cat <<EOF > slsa-provenance.json
          {
            "_type": "https://in-toto.io/Statement/v1",
            "subject": [
              {
                "name": "sbom-merged.json",
                "digest": { "sha256": "${SHA256}" }
              }
            ],
            "predicateType": "https://slsa.dev/provenance/v1",
            "predicate": {
              "buildDefinition": {
                "buildType": "https://actions.github.io/buildtypes/workflow/v1",
                "externalParameters": {
                  "repository": "${{ github.repository }}",
                  "ref": "${{ github.ref }}",
                  "sha": "${{ github.sha }}"
                }
              },
              "runDetails": {
                "builder": {
                  "id": "https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}"
                }
              }
            }
          }
          EOF
          cosign sign-blob --yes slsa-provenance.json --output-signature slsa-provenance.json.sig

      - name: Upload SLSA provenance
        uses: actions/upload-artifact@v7
        with:
          name: slsa-provenance
          path: slsa-provenance.json*
          retention-days: 7

  # Summary
  summary:
    name: CI Summary
    runs-on: ubuntu-24.04
    needs: [backend-tests, frontend-tests, security-scans, container-scans, sbom-generation, artifact-signing, slsa-provenance]
    if: always()
    steps:
      - name: Check job statuses
        run: |
          echo "Backend Tests: ${{ needs.backend-tests.result }}"
          echo "Frontend Tests: ${{ needs.frontend-tests.result }}"
          echo "Security Scans: ${{ needs.security-scans.result }}"
          echo "Container Scans: ${{ needs.container-scans.result }}"
          echo "SBOM Generation: ${{ needs.sbom-generation.result }}"
          echo "Artifact Signing: ${{ needs.artifact-signing.result }}"
          echo "SLSA Provenance: ${{ needs.slsa-provenance.result }}"
          if [ "${{ needs.backend-tests.result }}" != "success" ] || \
             [ "${{ needs.frontend-tests.result }}" != "success" ] || \
             [ "${{ needs.security-scans.result }}" != "success" ]; then
            echo "::error::One or more required test/security jobs failed"
            exit 1
          fi
          for res in "${{ needs.container-scans.result }}" "${{ needs.sbom-generation.result }}" "${{ needs.artifact-signing.result }}" "${{ needs.slsa-provenance.result }}"; do
            if [ "$res" != "success" ] && [ "$res" != "skipped" ]; then
              echo "::error::Main-branch supply-chain job failed with status: $res"
              exit 1
            fi
          done

