# Security Checks - Free GitHub Features Only
# Policy: docs/GITHUB_FREE_TIER.md
# Do NOT enable GitHub Secret Protection / Code Security / CodeQL default setup.
# Uses only free OSS tools: pip-audit, npm audit, gitleaks OSS CLI.

name: Security Checks

on:
  push:
    branches: [main, dev, develop]
  pull_request:
    branches: [main, dev, develop]
  schedule:
    - cron: "17 3 * * 1"  # Weekly on Monday 03:17 UTC
  workflow_dispatch:

permissions:
  contents: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

jobs:
  python-pip-audit:
    name: Python dependency audit
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Build audit requirements from requirements.txt
        run: |
          cp src/requirements.txt requirements.audit.txt

      - name: Install pip-audit
        run: |
          python -m pip install --upgrade pip pip-audit

      - name: Run pip-audit
        run: |
          python -m pip_audit --strict -r requirements.audit.txt

  npm-audit-portal:
    name: NPM audit (portal)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web/apps/portal
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: web/apps/portal/package-lock.json

      - name: Install dependencies
        run: |
          npm ci --ignore-scripts

      - name: Run npm audit (high+)
        run: |
          npm audit --audit-level=high

  # Upstream OSS binary (MIT). Do not use gitleaks/gitleaks-action (wrapper licenses).
  gitleaks:
    name: gitleaks (OSS CLI)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Download gitleaks
        env:
          GITLEAKS_VERSION: "8.24.3"
        run: |
          curl -sSL "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz" \
            | tar -xz gitleaks

      - name: Run gitleaks with baseline
        run: |
          ./gitleaks detect --source . --verbose --redact --baseline-path gitleaks-baseline.json
